# systemd drop-in: protect the co-hosted app production stack from Hermes.
# Install:
#   for unit in hermes-mcp.service hermes.service; do
#     sudo mkdir -p /etc/systemd/system/$unit.d
#     sudo cp hermes-resources.conf /etc/systemd/system/$unit.d/resources.conf
#   done
#   sudo systemctl daemon-reload && sudo systemctl restart hermes-mcp.service
#
# VPS: 4 vCPU / 8 GB, the co-hosted app (database, cache, web services) needs
# headroom. Headless Chromium alone can take 300-600 MB per tab.

[Service]
# Hard ceiling: OOM-kill Hermes before the kernel starts killing the co-hosted database.
MemoryHigh=2500M
MemoryMax=3G
# At most 2 of the 4 vCPUs, and lower scheduling priority than the co-hosted app.
CPUQuota=200%
Nice=10
IOWeight=50
TasksMax=512

# Filesystem hardening — Hermes may write only to its own home.
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/home/deploy/.hermes
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
# If Hermes/Playwright fails writing ~/.cache or ~/.local, add those dirs here — do not
# drop ProtectHome. Test with: systemd-analyze security hermes

[Unit]
# Keep restarts from hammering the box in a crash loop.
StartLimitIntervalSec=300
StartLimitBurst=5
