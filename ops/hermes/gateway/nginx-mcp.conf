# Hermes MCP Gateway — Nginx edge for https://api.motahai.com/mcp/
# Include inside the existing `server { listen 443 ssl; server_name api.motahai.com; ... }`.
# The limit_req_zone lines go in the `http {}` block (e.g. /etc/nginx/conf.d/mcp-zones.conf).
#
# Replace <<MCP_GATEWAY_PORT>> with the FastAPI gateway's loopback port.
# If Cloudflare proxies api.motahai.com, configure real_ip (set_real_ip_from + CF ranges)
# or every request will share Cloudflare's IP in the rate limiter.

# ── http {} block ────────────────────────────────────────────────────────────
# limit_req_zone  $binary_remote_addr zone=mcp_ip:10m   rate=120r/m;
# limit_conn_zone $binary_remote_addr zone=mcp_conn:10m;

# ── server {} block ──────────────────────────────────────────────────────────
location /mcp/ {
    # Coarse per-IP flood protection. Fine-grained per-agent limits live in policy_guard.py.
    limit_req  zone=mcp_ip burst=40 nodelay;
    limit_conn mcp_conn 20;
    limit_req_status 429;

    client_max_body_size 256k;

    # Reject anonymous traffic before it reaches Python (guard re-validates the token).
    if ($http_authorization !~* "^Bearer .{20,}") { return 401; }

    # Edge marker: ALWAYS overwritten here, so a client cannot spoof or remove it.
    # The guard refuses private-only roles (human_operator) when it is present.
    proxy_set_header X-Hermes-Edge   "public";
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host            $host;

    proxy_pass http://127.0.0.1:<<MCP_GATEWAY_PORT>>;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # SSE / Streamable HTTP: no buffering, long reads, keep-alive pings from the app
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    add_header X-Accel-Buffering no;
    proxy_read_timeout 330s;      # > longest tool timeout (run_task 300s) + margin
    proxy_send_timeout 330s;
    send_timeout       330s;

    access_log /var/log/nginx/mcp_access.log;
}

# Block everything else under the API host that should never be public
location ~ ^/(docs|redoc|openapi\.json)$ { return 404; }

