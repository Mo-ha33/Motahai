name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches deployment/isolation/Dockerfile.core (python:3.12-slim) and the README test notes.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pytest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q

  portal:
    name: Portal build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect portal project
        id: detect
        env:
          PORTAL_PKG_HASH: ${{ hashFiles('portal/package.json') }}
        run: |
          if [ -n "$PORTAL_PKG_HASH" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "portal/package.json not found; skipping portal job."
          fi

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install portal dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: portal
        run: npm ci

      - name: Build portal
        if: steps.detect.outputs.present == 'true'
        working-directory: portal
        run: npm run build

      - name: Run portal tests
        if: steps.detect.outputs.present == 'true'
        working-directory: portal
        run: npx vitest run
